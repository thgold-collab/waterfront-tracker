<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waterfront Deal Tracker — within 3 hrs of Glen Allen, VA</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --page: #f9f9f7;
    --ink-1: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --seq-450: #2a78d6; --seq-250: #86b6ef; --seq-600: #184f95;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --delta-good: #006300;
    --chip-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19; --page: #0d0d0d;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --delta-good: #0ca30c;
      --chip-bg: #262624;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --page: #0d0d0d;
    --ink-1: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --delta-good: #0ca30c;
    --chip-bg: #262624;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink-1);
    padding: 24px 20px 60px; line-height: 1.45;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header h1 { font-size: 22px; font-weight: 700; }
  header .sub { color: var(--ink-2); font-size: 13.5px; margin-top: 4px; }
  .criteria { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .criteria span {
    background: var(--chip-bg); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 11px; font-size: 12px; color: var(--ink-2);
  }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 20px 0; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
    font: inherit; color: inherit; text-align: left; width: 100%; display: block;
  }
  button.tile { cursor: pointer; }
  button.tile:hover { border-color: var(--baseline); }
  button.tile:focus-visible { outline: 2px solid var(--seq-450); outline-offset: 2px; }
  button.tile[aria-pressed="true"] { border-color: var(--seq-450); background: var(--chip-bg); }
  .tile .v { font-size: 24px; font-weight: 700; }
  .tile .l { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
  .tile .d { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .tile .go { font-size: 11px; color: var(--seq-450); margin-top: 6px; font-weight: 600; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0 14px; }
  .controls .grp { display: flex; gap: 6px; flex-wrap: wrap; }
  .controls button {
    font: inherit; font-size: 12.5px; cursor: pointer;
    background: var(--surface-1); color: var(--ink-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 13px;
  }
  .controls button.on { color: var(--ink-1); font-weight: 600; border-color: var(--baseline); background: var(--chip-bg); }
  .controls .spacer { flex: 1; }
  .controls select {
    font: inherit; font-size: 12.5px; background: var(--surface-1);
    color: var(--ink-1); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px;
  }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
    display: grid; grid-template-columns: 64px 1fr; gap: 14px;
  }
  .scorebox { text-align: center; }
  .scorebox .n { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .scorebox .meter {
    height: 4px; border-radius: 4px; background: var(--grid); margin-top: 6px; overflow: hidden;
  }
  .scorebox .meter i { display: block; height: 100%; border-radius: 4px; background: var(--seq-450); }
  .scorebox .t { font-size: 10.5px; color: var(--muted); margin-top: 5px; }
  .card h3 { font-size: 15px; font-weight: 650; }
  .card h3 a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--baseline); }
  .card h3 a:hover { border-bottom-color: var(--ink-1); }
  .toprow { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  .regiondot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 2px; }
  .r-es { background: var(--s2); } .r-nn { background: var(--s1); } .r-lk { background: var(--s3); }
  .price { font-weight: 700; font-size: 15px; }
  .was { color: var(--muted); text-decoration: line-through; font-size: 12.5px; font-weight: 400; }
  .cut { color: var(--delta-good); font-size: 12.5px; font-weight: 600; }
  .meta { color: var(--ink-2); font-size: 12.5px; margin-top: 3px; }
  .meta b { color: var(--ink-1); font-weight: 600; }
  .notes { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
  .flag { font-size: 12px; margin-top: 6px; color: var(--ink-2); }
  .flag .ic { color: var(--serious); font-weight: 700; margin-right: 4px; }
  .amen { font-size: 12.5px; margin-top: 6px; color: var(--ink-2); }
  .amen .ic { color: var(--s3); font-weight: 700; margin-right: 4px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--chip-bg); border: 1px solid var(--border); color: var(--ink-2);
  }
  .badge.new { border-color: var(--seq-450); color: var(--ink-1); }
  .badge.priority { border-color: var(--s2); color: var(--ink-1); }
  .badge.amenity { border-color: var(--s3); color: var(--ink-1); }
  .badge.dock { border-color: var(--s1); color: var(--ink-1); }
  .badge.stale { border-color: var(--warning); color: var(--ink-1); }
  .badge.fresh { border-color: var(--good); color: var(--ink-2); }
  .badge.gone { border-color: var(--critical); color: var(--ink-1); font-weight: 600; }
  .trackswitch { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .trackswitch button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: var(--surface-1); color: var(--ink-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 15px;
  }
  .trackswitch button.on { color: var(--ink-1); font-weight: 650; border-color: var(--s1); background: var(--chip-bg); }
  .trackswitch button:focus-visible { outline: 2px solid var(--seq-450); outline-offset: 2px; }
  .empty { background: var(--surface-1); border: 1px dashed var(--baseline); border-radius: 10px; padding: 22px; color: var(--ink-2); font-size: 13px; }
  .badge.pending { border-color: var(--warning); color: var(--ink-1); }
  .badge.sold { border-color: var(--muted); color: var(--muted); }
  .badge.removed { border-color: var(--critical); color: var(--ink-1); }
  .card.inactive { opacity: 0.55; }
  .card.priority { border-left: 3px solid var(--s2); }
  @keyframes cardflash { from { box-shadow: 0 0 0 3px var(--s2); } to { box-shadow: 0 0 0 3px transparent; } }
  .card.flash { animation: cardflash 1.6s ease-out; }
  @media (prefers-reduced-motion: reduce) { .card.flash { animation: none; box-shadow: 0 0 0 2px var(--s2); } }
  .sechead { margin: 26px 0 10px; font-size: 13px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  footer { margin-top: 34px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--grid); padding-top: 14px; }
  footer p { margin-bottom: 6px; }
  .themebtn {
    float: right; font: inherit; font-size: 12px; cursor: pointer;
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--ink-2); padding: 4px 10px;
  }
  @media (max-width: 560px) { .card { grid-template-columns: 1fr; } .scorebox { text-align: left; display: flex; align-items: center; gap: 10px; } .scorebox .meter { flex: 1; margin-top: 0; } }
</style>
</head>

<div class="wrap">
  <header>
    <button class="themebtn" onclick="toggleTheme()">Light / dark</button>
    <h1>Waterfront Deal Tracker</h1>
    <div class="sub">Run <span id="runnumber"></span><span id="runlabel"></span> &middot; <b id="rundate"></b><span id="tracksub"></span></div>

      <button data-r="lk">Lakes</button>

    <div class="grp" id="priorityFilter"></div>
    <div class="grp" id="amenityFilter"></div>

  <div class="sechead" id="listHead">Scored watchlist</div>
  <div class="list" id="list"></div>

  <footer>
    <p id="rubric"></p>
    <p id="footnote"></p>
    <p>Data gathered from LandSearch, LandWatch, Homes.com, Howard Hanna, Trulia, Zillow, Redfin, REMAX, and regional brokerage sites. Next scheduled run: Fridays ~7am ET.</p>
    <p id="runnote"></p>
  </footer>
</div>

appahannock River","Mattaponi River","Pamunkey River","Urbanna Creek","Piankatank River","Occupacia Creek","Hoskins Creek"],"excludedAreas":["Reedville"],"driveTimesRouted":true,"bandExempt":["Cape Charles","Bay Creek"],"wantsAmenityCommunity":true,"wantsWalkableTown":true,"settingIsCompensatory":"water and community amenities are scored as alternatives, not as a sum"},"rubric":[{"label":"setting — waterfront quality or community amenities, whichever leads","detail":"scored on the stronger axis, so neither type is punished for lacking the other","pts":25},{"label":"price vs. comps","detail":"against nearby sold comps","pts":20},{"label":"town & things to do","detail":"a walkable centre, somewhere to eat, a reason to spend a Saturday","pts":15},{"label":"house condition & systems","detail":"age, roof/HVAC, well/septic, flood","pts":12},{"label":"drive time","detail":"60–90 min from Glen Allen strongly preferred","pts":12},{"label":"dock & boating","detail":"existing pier, lift, deeded slip, MLW depth","pts":10},{"label":"lot & privacy","detail":"acreage, screening, neighbours","pts":6}],"footnote":"A high score is a shortlist signal, not an inspection. Setting is scored on the stronger of water or community, so a bare waterfront house and an amenity community can reach the same mark by different routes. Anything here still needs a home inspection, a flood-zone and elevation-certificate check, a well/septic review and a dock-permit check before an offer.","emptyMsg":"Nothing on this track inside the 60–90 minute band yet — clear the drive filter to see the wider board.","townScores":{"Irvington":13,"Urbanna":13,"Kilmarnock":11,"Tappahannock":10,"Deltaville":10,"Gloucester":9,"Hayes":9,"Montross":9,"White Stone":8,"Mathews":8,"Susan":8,"Warsaw":6,"Saluda":5,"Reedville":4,"Lancaster":4,"Church View":4,"Cobbs Creek":3,"Hallieford":3,"Moon":3,"Dutton":3,"Kinsale":4,"Corbin Hall":3}}]}</script>

<script>
  const state = JSON.parse(document.getElementById('state').textContent);
  const TRACKS = (Array.isArray(state.tracks) && state.tracks.length) ? state.tracks
    : [{ id: 'land', label: 'All listings', chips: [], rubric: state.rubric || [] }];
  let track = TRACKS.find(t => t.id === state.activeTrack) || TRACKS[0];
  let region = 'all', type = 'all', sort = 'score';
  let cutsOnly = false, priorityOnly = false, amenityOnly = false, dockOnly = false, staleOnly = false;
  let nearOnly = false;

  // Every "reset the filters" path used to repeat this list, so adding a filter meant
  // remembering four places. It is one place now.
  function clearFilters() {
    region = 'all'; type = 'all';
    cutsOnly = dockOnly = priorityOnly = amenityOnly = staleOnly = nearOnly = false;
  }

  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]); }
  function money(n) { return '$' + Number(n).toLocaleString('en-US'); }
  function ppa(x) { return (x.acres && x.price) ? Math.round(x.price / x.acres) : null; }
  function driveMin(d) { const m = String(d).match(/(\d+)h(\d+)/); return m ? (+m[1]) * 60 + (+m[2]) : 999; }
  function cutPct(x) { return Math.round((x.priceWas - x.price) / x.priceWas * 100); }
  function shortName(x) { return esc(String(x.name).split(',')[0]); }
  function amenities(x) { return Array.isArray(x.amenities) ? x.amenities : []; }
  function hasAmenities(x) { return amenities(x).length > 0; }
  function hasDock(x) { return !!x.dock; }

  // Drive band. The brief narrowed from "under 2 hours" to a 60-90 minute ring, which is
  // a scope question rather than a scoring one -- so it filters, and the rubric is left
  // alone. A track with no band declared shows no chip at all.
  function driveBand() {
    const b = (track.criteria || {}).driveBandMins;
    return (Array.isArray(b) && b.length === 2) ? b : null;
  }
  function inBand(x) {
    const b = driveBand();
    if (!b) return true;
    // Named areas are searched on purpose despite sitting outside the ring -- Bay Creek is
    // wanted for its community, not its drive -- so the band must not quietly hide them.
    const ex = (track.criteria || {}).bandExempt || [];
    const hay = ((x.name || '') + ' ' + (x.water || '')).toLowerCase();
    if (ex.some(s => hay.includes(String(s).toLowerCase()))) return true;
    const m = driveMin(x.drive);
    return m !== 999 && m >= b[0] && m <= b[1];
  }

  // Freshness. "active" is a claim, and a claim needs a date and a source or it is
  // worthless -- a house that sold months ago otherwise looks identical to a new listing.
  const VERIFY_DAYS = 14;
  function daysSince(iso) {
    if (!iso) return null;
    const a = new Date(iso + 'T12:00:00'), b = new Date(state.runDate + 'T12:00:00');
    if (isNaN(a)) return null;
    return Math.round((b - a) / 86400000);
  }
  function statusAge(x) { return daysSince(x.statusAsOf); }
  function isVerified(x) { const d = statusAge(x); return d !== null && d <= VERIFY_DAYS; }
  function isStale(x) { return x.status === 'active' && !isVerified(x); }

  // Priority areas are matched by name so new listings inherit the flag automatically.
  function priorityAreas() { return (track.priorityAreas || state.priorityAreas || []).map(s => s.toLowerCase()); }
  function priorityLabel() { return track.priorityLabel || state.priorityLabel || 'Priority areas'; }
  function isPriority(x) {
    if (x.priority === true) return true;
    const hay = ((x.name || '') + ' ' + (x.water || '')).toLowerCase();
    return priorityAreas().some(p => hay.includes(p));
  }

  // Every listing belongs to exactly one track; legacy rows with no track are land.
  function trackOf(x) { return x.track || 'land'; }
  function trackListings(id) { return state.listings.filter(x => trackOf(x) === (id || track.id)); }

  document.getElementById('rundate').textContent = new Date(state.runDate + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  document.getElementById('runnumber').textContent = state.runNumber;
  document.getElementById('runlabel').textContent = state.runLabel ? ' · ' + state.runLabel : '';
  const noteEl = document.getElementById('runnote');
  if (state.runNote) noteEl.innerHTML = '<b>Run ' + esc(state.runNumber) + ' note:</b> ' + esc(state.runNote);
  else noteEl.remove();

  function renderTrackSwitch() {
    const el = document.getElementById('trackSwitch');
    if (TRACKS.length < 2) { el.innerHTML = ''; return; }
    el.innerHTML = TRACKS.map(t => {
      const n = trackListings(t.id).filter(x => x.status === 'active').length;
      return '<button type="button" data-track="' + esc(t.id) + '" aria-pressed="' + (t.id === track.id) + '"' +
        (t.id === track.id ? ' class="on"' : '') + '>' + esc(t.label) + ' (' + n + ')</button>';
    }).join('');
  }

  function renderTrackHeader() {
    document.getElementById('tracksub').textContent = track.blurb ? ' · ' + track.blurb : '';
    document.getElementById('criteria').innerHTML = (track.chips || []).map(c => '<span>' + esc(c) + '</span>').join('');
    const rub = document.getElementById('rubric');
    const r = track.rubric || [];
    rub.innerHTML = r.length ? '<b>Scoring rubric (0&ndash;100):</b> ' + r
      .map(x => esc(x.label) + (x.detail ? ' &mdash; ' + esc(x.detail) : '') + ' (' + esc(x.pts) + ')').join(' &middot; ') + '.' : '';
    rub.style.display = r.length ? '' : 'none';
    const fn = document.getElementById('footnote');
    fn.innerHTML = track.footnote ? '<b>Read the flags.</b> ' + esc(track.footnote) : '';
    fn.style.display = track.footnote ? '' : 'none';
  }

  const DEFAULT_TYPES = [{ v: 'all', label: 'All types' }];
  const DEFAULT_SORTS = [{ v: 'score', label: 'score' }, { v: 'price', label: 'price (low first)' }, { v: 'drive', label: 'drive time' }];

  function renderTypeFilters() {
    const defs = (track.typeFilters && track.typeFilters.length) ? track.typeFilters : DEFAULT_TYPES;
    if (!defs.some(d => d.v === type)) type = defs[0].v;
    document.getElementById('typeFilters').innerHTML = defs
      .map(d => '<button data-t="' + esc(d.v) + '"' + (d.v === type ? ' class="on"' : '') + '>' + esc(d.label) + '</button>').join('');
  }

  function renderSorts() {
    const defs = (track.sorts && track.sorts.length) ? track.sorts : DEFAULT_SORTS;
    if (!defs.some(d => d.v === sort)) sort = defs[0].v;
    document.getElementById('sortSel').innerHTML = defs
      .map(d => '<option value="' + esc(d.v) + '"' + (d.v === sort ? ' selected' : '') + '>Sort: ' + esc(d.label) + '</option>').join('');
  }

  function renderTiles() {
    const active = trackListings().filter(x => x.status === 'active');
    const wf = active.filter(x => x.type === 'waterfront');
    const cuts = active.filter(x => x.priceWas);
    const docks = active.filter(hasDock);
    const verified = active.filter(isVerified);
    const tiles = [{
      v: active.length, l: track.unit || 'candidates on watchlist',
      d: verified.length + ' of ' + active.length + ' status-verified',
      action: 'all', go: 'Show all'
    }];
    if (active.length && verified.length < active.length) {
      tiles.push({
        v: active.length - verified.length, l: 'status unverified',
        d: 'not confirmed in ' + VERIFY_DAYS + ' days',
        action: 'stale', pressed: staleOnly, go: staleOnly ? 'Clear filter' : 'Show only these'
      });
    }
    // Every tile below derives from a filtered subset, so guard the empty case: a bare
    // reduce() on an empty array throws and blanks the whole page.
    if (active.length) {
      const top = active.reduce((a, b) => b.score > a.score ? b : a);
      tiles.push({ v: top.score, l: 'top score', d: shortName(top), action: 'focus', id: top.id, go: 'Jump to listing' });
    }
    if (docks.length) {
      tiles.push({ v: docks.length, l: 'with a dock or slip', d: 'of ' + active.length + ' active',
        action: 'dock', pressed: dockOnly, go: dockOnly ? 'Clear filter' : 'Show only these' });
    }
    if (cuts.length) {
      const biggest = cuts.reduce((a, b) => cutPct(b) > cutPct(a) ? b : a);
      tiles.push({ v: cuts.length, l: 'with price cuts', d: 'biggest: -' + cutPct(biggest) + '% (' + shortName(biggest) + ')',
        action: 'cuts', pressed: cutsOnly, go: cutsOnly ? 'Clear filter' : 'Show only these' });
    } else {
      tiles.push({ v: 0, l: 'with price cuts', d: 'none active this run' });
    }
    if (wf.length) {
      const cheapest = wf.reduce((a, b) => b.price < a.price ? b : a);
      tiles.push({ v: money(cheapest.price), l: 'cheapest true waterfront', d: shortName(cheapest), action: 'focus', id: cheapest.id, go: 'Jump to listing' });
    }
    document.getElementById('tiles').innerHTML = tiles.map(t => {
      const inner = '<div class="v">' + t.v + '</div><div class="l">' + t.l + '</div><div class="d">' + t.d + '</div>' +
        (t.go ? '<div class="go">' + t.go + ' &rarr;</div>' : '');
      if (!t.action) return '<div class="tile">' + inner + '</div>';
      return '<button type="button" class="tile" data-action="' + t.action + '"' +
        (t.id ? ' data-id="' + esc(t.id) + '"' : '') +
        (t.pressed !== undefined ? ' aria-pressed="' + !!t.pressed + '"' : '') + '>' + inner + '</button>';
    }).join('');
  }

  function renderPriorityFilter() {
    const el = document.getElementById('priorityFilter');
    const n = trackListings().filter(isPriority).length;
    if (!priorityAreas().length || !n) { el.innerHTML = ''; return; }
    el.innerHTML = '<button type="button" aria-pressed="' + priorityOnly + '"' + (priorityOnly ? ' class="on"' : '') +
      '>&#9733; ' + esc(priorityLabel()) + ' (' + n + ')</button>';
  }

  function renderAmenityFilter() {
    const el = document.getElementById('amenityFilter');
    const n = trackListings().filter(hasAmenities).length;
    if (!n) { el.innerHTML = ''; return; }
    el.innerHTML = '<button type="button" aria-pressed="' + amenityOnly + '"' + (amenityOnly ? ' class="on"' : '') +
      '>&#9752; Amenity communities (' + n + ')</button>';
  }

  function renderNearFilter() {
    const el = document.getElementById('nearFilter');
    const b = driveBand();
    if (!b) { el.innerHTML = ''; return; }
    const n = trackListings().filter(inBand).length;
    el.innerHTML = '<button type="button" aria-pressed="' + nearOnly + '"' + (nearOnly ? ' class="on"' : '') +
      '>&#9204; ' + b[0] + '&ndash;' + b[1] + ' min drive (' + n + ')</button>';
  }

  function syncFilterButtons() {
    document.querySelectorAll('#regionFilters button').forEach(b => b.classList.toggle('on', b.dataset.r === region));
    document.querySelectorAll('#typeFilters button').forEach(b => b.classList.toggle('on', b.dataset.t === type));
  }

  // All listing text is scraped from third-party sites, so every interpolated field
  // goes through esc(). Separators stay as literal entities.
  function card(x) {
    const p = ppa(x);
    const score = Number(x.score) || 0;
    const cut = x.priceWas ? '<span class="was">' + money(x.priceWas) + '</span> <span class="cut">-' + cutPct(x) + '%</span>' : '';
    const flags = (x.flags || []).length ? '<div class="flag"><span class="ic">&#9650;</span>' + x.flags.map(esc).join(' &middot; ') + '</div>' : '';
    const am = amenities(x);
    const amLine = am.length ? '<div class="amen"><span class="ic">&#9752;</span>' + am.map(esc).join(' &middot; ') + '</div>' : '';
    const amBadge = am.length ? '<span class="badge amenity">' + am.length + (am.length === 1 ? ' amenity' : ' amenities') + '</span>' : '';
    const dockBadge = x.dock ? '<span class="badge dock">&#9875; ' + esc(x.dock === true ? 'Dock' : x.dock) + '</span>' : '';
    const isNew = x.firstSeenRun === state.runNumber;
    const inactive = x.status && x.status !== 'active';
    const soldBit = x.soldOn ? ' ' + esc(x.soldOn) : '';
    const statusBadge = inactive
      ? '<span class="badge ' + esc(x.status) + (x.status === 'sold' || x.status === 'removed' ? ' gone' : '') + '">' +
        esc(String(x.status).toUpperCase()) + soldBit + '</span>' : '';
    const age = statusAge(x);
    const freshBadge = x.status !== 'active' ? ''
      : isVerified(x) ? '<span class="badge fresh">verified ' + (age === 0 ? 'today' : age + 'd ago') + '</span>'
      : '<span class="badge stale">&#9888; status ' + (age === null ? 'never verified' : 'unverified ' + age + 'd') + '</span>';
    const pri = isPriority(x);
    const priBadge = pri ? '<span class="badge priority">&#9733; Priority area</span>' : '';
    const spec = [];
    if (x.beds) spec.push(x.beds + ' bd');
    if (x.baths) spec.push(x.baths + ' ba');
    if (x.sqft) spec.push(Number(x.sqft).toLocaleString('en-US') + ' sf');
    if (x.yearBuilt) spec.push('built ' + x.yearBuilt);
    const specBit = spec.length ? ' &middot; <b>' + esc(spec.join(' / ')) + '</b>' : '';
    return '<div class="card' + (inactive ? ' inactive' : '') + (pri ? ' priority' : '') + '" data-id="' + esc(x.id) + '">' +
      '<div class="scorebox"><div class="n">' + score + '</div><div class="meter"><i style="width:' + score + '%"></i></div><div class="t">score</div></div>' +
      '<div><div class="toprow">' +
        '<h3><i class="regiondot r-' + esc(x.region) + '"></i> <a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.name) + '</a></h3>' +
        '<span class="price">' + money(x.price) + '</span> ' + cut +
      '</div>' +
      '<div class="meta"><b>' + esc((track.typeNames && track.typeNames[x.type]) || x.type) + '</b>' + specBit + ' &middot; ' + esc(x.water) +
        (x.acres ? ' &middot; ' + esc(x.acres) + ' ac' + (p && !x.beds ? ' (' + money(p) + '/ac)' : '') : '') +
        ' &middot; drive ~' + esc(String(x.drive).replace('h', 'h ')) + 'm &middot; HOA: ' + esc(x.hoa) +
        (x.listedOn ? ' &middot; listed ' + esc(x.listedOn) : '') +
        (x.statusSource ? ' &middot; source: ' + esc(x.statusSource) : '') + '</div>' +
      '<div class="notes">' + (x.highlights || []).map(esc).join(' &middot; ') + '</div>' + amLine + flags +
      '<div class="badges">' + (isNew ? '<span class="badge new">New this run</span>' : '') + freshBadge + dockBadge + priBadge + amBadge + statusBadge +
        '<span class="badge">' + esc(x.signals) + '</span></div>' +
      '</div></div>';
  }

  function render() {
    const all = trackListings();
    let rows = all.filter(x =>
      (region === 'all' || x.region === region) &&
      (type === 'all' || x.type === type) &&
      (!cutsOnly || !!x.priceWas) &&
      (!dockOnly || hasDock(x)) &&
      (!staleOnly || isStale(x)) &&
      (!priorityOnly || isPriority(x)) &&
      (!amenityOnly || hasAmenities(x)) &&
      (!nearOnly || inBand(x)));
    rows.sort((a, b) => {
      if (sort === 'priority') { const d = (isPriority(b) ? 1 : 0) - (isPriority(a) ? 1 : 0); return d || (b.score - a.score); }
      if (sort === 'amenities') { const d = amenities(b).length - amenities(a).length; return d || (b.score - a.score); }
      if (sort === 'beds') { const d = (Number(b.beds) || 0) - (Number(a.beds) || 0); return d || (b.score - a.score); }
      if (sort === 'dock') { const d = (hasDock(b) ? 1 : 0) - (hasDock(a) ? 1 : 0); return d || (b.score - a.score); }
      if (sort === 'score') return b.score - a.score;
      if (sort === 'price') return a.price - b.price;
      if (sort === 'pricehigh') return b.price - a.price;
      if (sort === 'ppa') return (ppa(a) || 9e9) - (ppa(b) || 9e9);
      if (sort === 'drive') return driveMin(a.drive) - driveMin(b.drive);
      return 0;
    });
    const on = [];
    if (cutsOnly) on.push('price cuts only');
    if (dockOnly) on.push('dock or slip only');
    if (staleOnly) on.push('unverified status only');
    if (priorityOnly) on.push('priority areas only');
    if (amenityOnly) on.push('amenity communities only');
    if (nearOnly) { const b = driveBand(); on.push(b[0] + '-' + b[1] + ' min drive only'); }
    document.getElementById('listHead').textContent = (track.listLabel || 'Scored watchlist') + ' — ' +
      rows.length + ' of ' + all.length + ' shown' + (on.length ? ' · ' + on.join(' · ') : '');
    const list = document.getElementById('list');
    list.innerHTML = rows.length ? rows.map(card).join('')
      : '<div class="empty">' + esc(all.length ? 'No listings match these filters.' : (track.emptyMsg || 'Nothing on this track yet.')) + '</div>';
  }

  function renderAll() {
    renderTrackSwitch(); renderTrackHeader(); renderTypeFilters(); renderSorts();
    syncFilterButtons(); renderTiles(); renderPriorityFilter(); renderAmenityFilter(); renderNearFilter(); render();
  }

  function applyTrackDefaults() { nearOnly = !!(track.criteria || {}).driveBandDefault; }

  function switchTrack(id) {
    const t = TRACKS.find(x => x.id === id);
    if (!t || t === track) return;
    track = t;
    clearFilters();
    applyTrackDefaults();
    renderAll();
  }

  // Clear every filter, then scroll to one listing and flash it.
  function focusListing(id) {
    clearFilters();
    renderAll();
    const el = document.querySelector('.card[data-id="' + CSS.escape(String(id)) + '"]');
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
  }

  document.getElementById('trackSwitch').addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) switchTrack(b.dataset.track);
  });
  document.getElementById('regionFilters').addEventListener('click', e => {
    if (e.target.tagName !== 'BUTTON') return;
    region = e.target.dataset.r; syncFilterButtons(); render();
  });
  document.getElementById('typeFilters').addEventListener('click', e => {
    if (e.target.tagName !== 'BUTTON') return;
    type = e.target.dataset.t; syncFilterButtons(); render();
  });
  document.getElementById('sortSel').addEventListener('change', e => { sort = e.target.value; render(); });
  document.getElementById('tiles').addEventListener('click', e => {
    const btn = e.target.closest('button.tile'); if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'focus') { focusListing(btn.dataset.id); return; }
    if (action === 'all') { clearFilters(); }
    else if (action === 'cuts') { cutsOnly = !cutsOnly; }
    else if (action === 'dock') { dockOnly = !dockOnly; }
    else if (action === 'stale') { staleOnly = !staleOnly; }
    renderAll();
  });
  document.getElementById('nearFilter').addEventListener('click', e => {
    if (!e.target.closest('button')) return;
    nearOnly = !nearOnly; renderNearFilter(); render();
  });
  document.getElementById('priorityFilter').addEventListener('click', e => {
    if (!e.target.closest('button')) return;
    priorityOnly = !priorityOnly; renderPriorityFilter(); render();
  });
  document.getElementById('amenityFilter').addEventListener('click', e => {
    if (!e.target.closest('button')) return;
    amenityOnly = !amenityOnly; renderAmenityFilter(); render();
  });

  function toggleTheme() {
    const r = document.documentElement;
    const cur = r.getAttribute('data-theme');
    const osDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    r.setAttribute('data-theme', (cur ? cur === 'dark' : osDark) ? 'light' : 'dark');
  }

  applyTrackDefaults();
  renderAll();
</script>
</body>
</html>
